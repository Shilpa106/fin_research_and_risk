name: Enterprise GenAI Evaluation & Quality Regression Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluation-gate:
    name: GenAI RAG, Agent & Safety Quality Gating
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Integration Tests
        run: |
          python -m pytest tests/integration/test_evaluation_platform.py -v --tb=short

      - name: Run Automated Evaluation Benchmark & Regression Detection Gate
        id: eval_gate
        run: |
          python -m src.evaluation.cli \
            --dataset institutional-financial-eval-v1 \
            --model claude-3-5-sonnet \
            --fail-on-regression \
            --output evaluation_summary.json \
            --markdown-report evaluation_report.md

      - name: Publish Evaluation Summary to Job Summary
        if: always()
        run: |
          if [ -f evaluation_report.md ]; then
            cat evaluation_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genai-evaluation-report
          path: |
            evaluation_summary.json
            evaluation_report.md
          retention-days: 30
